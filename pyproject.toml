[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drag_drop_zip_b64"
version = "1.1.0"
description = "Drag & Drop tool for ZIP compression and Base64 encoding/decoding with encryption and secure upload"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "EDemerzel", email = "edemerzel@outlook.com" }]
requires-python = ">=3.8"
dependencies = [
  "PyQt5==5.15.11",
  "PyQt5-stubs==5.15.6.0",
  "cryptography>=3.4.8",
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "types-requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=22.0.0", "isort>=5.0.0", "mypy>=1.0.0"]

[project.scripts]
drag-drop-zip-b64 = "drag_drop_zip_b64.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100
known_third_party = ["PyQt5", "cryptography", "requests", "urllib3"]
src_paths = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
