[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drag_drop_zip_b64"
version = "0.1.0"
description = "Drag & Drop tool for ZIP compression and Base64 encoding/decoding"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "EDemerzel", email = "edemerzel@outlook.com" },
]
requires-python = ">=3.8"
dependencies = [
  "PyQt5>=5.15",
]

# Add this section after [project]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

# Fix the console script entry point
[project.scripts]
drag-drop-zip-b64 = "drag_drop_zip_b64.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100
known_third_party = ["PyQt5"]
src_paths = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }