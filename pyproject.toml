[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drag_drop_zip_b64"
version = "0.1.0"
description = "Drag & Drop tool for ZIP compression and Base64 encoding/decoding"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Your Name", email = "you@example.com" },
]
requires-python = ">=3.8"
dependencies = [
  "PyQt5>=5.15",
]

# defines a console‐script entry point so you can run it as:
#    python -m drag_drop_zip_b64
[project.scripts]
drag-drop-zip-b64 = "drag_drop_zip_b64:main"

[tool.pytest.ini_options]
# if you add any tests later
python_files = "tests/*.py"